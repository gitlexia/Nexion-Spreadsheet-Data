services:
  - type: web
    name: nexion-social-reporting
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: META_USER_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        sync: false
      - key: REPORT_PASSWORD
        sync: false
